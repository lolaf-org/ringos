name: token-check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Passing `token` writes the http.https://github.com/.extraheader credential into the
      # checkout's git config - the exact mechanism maven-release-plugin's `git push` will use.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      # Before the push, so a refusal still comes with a diagnosis.
      - name: What the token is allowed to do
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }} --jq '.permissions'

      # An empty commit proves the push without changing a byte. Deliberately not a workflow file:
      # pushing one needs the Workflows permission on top of Contents, and the release commits only
      # ever touch poms, so Contents is what needs proving.
      - name: Push an empty commit to the protected branch
        run: |
          git config user.name "ringos release"
          git config user.email "security@lolaf.org"
          git commit --allow-empty -m "prove the release token can push to a protected main"
          git push origin HEAD:main