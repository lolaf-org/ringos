name: build

on:
  push:
    branches: [ main ]
  pull_request:

# A superseded run on a pull request is not worth runner minutes, but every commit landing on main gets verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Reports the check `build / build`, which is what branch protection on main requires.
  # The whole of ringos builds in about a minute locally; the default 20-minute ceiling is for a cold runner.
  build:
    uses: lolaf-org/workflows/.github/workflows/maven-build.yml@v1.0.0
    with:
      # Several modules compile against JDK internals that moved between releases and so build through a
      # toolchain: unsafe-operations-impl-11-14 and lib-impl-unsafe-11 ask for 11, unsafe-operations-impl-25
      # asks for 25. Listing them is what writes the ~/.m2/toolchains.xml they resolve against, so dropping
      # one breaks those modules rather than skipping them.
      toolchain-jdks: |
        11
        21
        25
