name: build

on:
  push:
    branches: [ main ]
  pull_request:

# A superseded run on a pull request is not worth runner minutes, but every commit landing on main gets verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # the whole of ringos builds in about a minute locally; the ceiling is for a cold runner, not the work
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Several modules compile against JDK internals that moved between releases and so build through a
      # toolchain: unsafe-operations-impl-11-14 and lib-impl-unsafe-11 ask for 11, unsafe-operations-impl-25
      # asks for 25. Listing the versions here is what writes the ~/.m2/toolchains.xml they resolve against,
      # so dropping one breaks those modules rather than skipping them.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: |
            11
            21
            25

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B -T 1C clean install

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore
